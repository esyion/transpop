[package]
name = "transpop"
version = "0.2.10"
description = "TransPop - a lightweight desktop translation tool"
authors = ["esyion"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transpop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ---- 应用框架 ----
tauri = { version = "2", features = ["tray-icon"] }

# ---- 序列化与 IPC 契约 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 持久化（SQLite） ----
rusqlite = { version = "0.40.1", features = ["bundled"] }

# ---- 加密与密钥托管 ----
aes-gcm = "0.10"
base64 = "0.22.1"
keyring = "4.1.5"

# ---- 网络（OpenAI 兼容端点） ----
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ---- 通用工具 ----
# async-trait：TranslatorClient 端口需要 dyn 分发（原生 async trait 不支持对象安全）
async-trait = "0.1"
# log：日志门面，具体实现由 tauri-plugin-log 提供
log = "0.4"
# thiserror：领域错误结构化建模
thiserror = "2"
# uuid：历史条目 ID（v4 随机 UUID，替代旧版「时间戳+长度」方案，消除主键冲突）
uuid = { version = "1", features = ["v4"] }

# ---- Tauri 插件 ----
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2.5.1"
